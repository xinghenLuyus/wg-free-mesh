name: Build App Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - client/**
      - front/**
      - src/**
      - docker/app/**
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/xinghenluyus/wg-free-mesh-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tags
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("src/pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          rc_pattern='^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
          if [[ "${version}" =~ ${stable_pattern} ]]; then
            release_kind="stable"
          elif [[ "${version}" =~ ${rc_pattern} ]]; then
            release_kind="rc"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version ${version} is not a supported image tag. Expected x.y.z or x.y.z-rc.n."
            exit 0
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Git tag ${GITHUB_REF_NAME} does not match src/pyproject.toml version ${version}; skipping image build."
            exit 0
          fi

          stable_exists="false"
          if git tag --list "v[0-9]*.[0-9]*.[0-9]*" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            stable_exists="true"
          fi

          tags="${IMAGE_NAME}:${version}"
          if [[ "${release_kind}" == "stable" || "${stable_exists}" == "false" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "release_kind=${release_kind}" >> "$GITHUB_OUTPUT"
          echo "stable_exists=${stable_exists}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${tags}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.version.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/backend.Dockerfile
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
