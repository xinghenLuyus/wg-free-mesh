name: Build App Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - client/**
      - front/**
      - src/**
      - docker/app/**
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/xinghenluyus/wg-free-mesh-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("src/pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="v${version}"
            if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
              echo "Git tag ${GITHUB_REF_NAME} does not match src/pyproject.toml version ${version}" >&2
              exit 1
            fi
          fi

      - name: Decide tags
        id: tags
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          short_sha="${GITHUB_SHA::12}"
          tags="${IMAGE_NAME}:sha-${short_sha}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${version}"
            tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
          else
            tags="${tags}"$'\n'"${IMAGE_NAME}:dev"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${tags}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/backend.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
