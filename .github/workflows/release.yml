name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("src/pyproject.toml", "rb"))["project"]["version"])')"
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          rc_pattern='^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
          if [[ "${version}" =~ ${stable_pattern} ]]; then
            prerelease="false"
          elif [[ "${version}" =~ ${rc_pattern} ]]; then
            prerelease="true"
          else
            echo "Version ${version} is not supported. Expected x.y.z or x.y.z-rc.n." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match src/pyproject.toml version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: client/go.sum

      - name: Build client packages
        working-directory: client
        run: python build_release.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WG Free Mesh v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            WG Free Mesh v${{ steps.version.outputs.version }}

            Client packages are attached below.
          files: client/dist/*.zip
